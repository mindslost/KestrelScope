name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (.NET 9)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore KestrelScope.sln

      - name: Build solution (Release)
        run: dotnet build KestrelScope.sln -c Release --no-restore

      - name: Run End-to-End Integration Tests
        run: |
          dotnet test tests/KestrelScope.EndToEndTests/KestrelScope.EndToEndTests.csproj \
            -c Release \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=test-results.trx"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-dotnet9
          path: '**/TestResults/*.trx'
          retention-days: 14

  docker-build:
    name: Docker Container Build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Compose Services
        run: docker compose build

      - name: Verify Container Images
        run: |
          docker images | grep -E 'kestrelscope|sample-order-service'
