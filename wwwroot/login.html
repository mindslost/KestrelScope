<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — KestrelScope</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    body {
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 30%, rgba(15, 108, 189, 0.1), transparent 70%), var(--fui-colorNeutralBackground1);
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <div style="display:inline-flex; align-items:center; justify-content:center; width:48px; height:48px; border-radius:var(--fui-borderRadiusLarge); background:rgba(15, 108, 189, 0.18); border:1px solid var(--fui-colorBrandStroke1); margin-bottom:0.75rem; box-shadow:var(--fui-shadow4);">
        <svg width="28" height="28" viewBox="0 0 512 512" fill="var(--fui-colorBrandForeground1)">
          <path d="M160 32c0-17.7 14.3-32 32-32l32 0c17.7 0 32 14.3 32 32c17.7 0 32 14.3 32 32l0 224c0 17.7-14.3 32-32 32c0 17.7-14.3 32-32 32l-32 0c-17.7 0-32-14.3-32-32c-17.7 0-32-14.3-32-32l0-224c0-17.7 14.3-32 32-32zM32 448l288 0c70.7 0 128-57.3 128-128s-57.3-128-128-128l0-64c106 0 192 86 192 192c0 49.2-18.5 94-48.9 128l16.9 0c17.7 0 32 14.3 32 32s-14.3 32-32 32l-160 0L32 512c-17.7 0-32-14.3-32-32s14.3-32 32-32zm80-64l192 0c8.8 0 16 7.2 16 16s-7.2 16-16 16l-192 0c-8.8 0-16-7.2-16-16s7.2-16 16-16z"/>
        </svg>
      </div>
      <h1>KestrelScope</h1>
      <p>Sovereign Observability Platform</p>
    </div>

    <div id="loginError" class="login-error"></div>

    <form id="loginForm" class="modal-form">
      <div>
        <label class="filter-label" style="margin-bottom:0.35rem; display:block;">Username</label>
        <input type="text" id="username" class="filter-input" style="width:100%;" placeholder="admin" required autofocus>
      </div>

      <div>
        <label class="filter-label" style="margin-bottom:0.35rem; display:block;">Password</label>
        <input type="password" id="password" class="filter-input" style="width:100%;" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-primary" style="width:100%; margin-top:0.75rem; padding:0.65rem;">
        Sign In
      </button>
    </form>
  </div>

  <script src="/js/app.js"></script>
  <script>
    checkAuth(true);
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      handleLogin(
        document.getElementById('username').value,
        document.getElementById('password').value
      );
    });
  </script>
</body>
</html>
