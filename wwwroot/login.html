<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — KestrelScope</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body style="justify-content: center; align-items: center;">
  <div class="login-card">
    <div class="login-header">
      <div style="display:inline-flex; align-items:center; justify-content:center; width:48px; height:48px; border-radius:12px; background:rgba(56,189,248,0.1); border:1px solid rgba(56,189,248,0.3); margin-bottom:0.75rem;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="#38bdf8">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
        </svg>
      </div>
      <h1>KestrelScope</h1>
      <p>Sovereign Observability Monolith</p>
    </div>

    <div id="loginError" class="login-error"></div>

    <form id="loginForm" class="modal-form">
      <div>
        <label class="filter-label" style="margin-bottom:0.4rem; display:block;">Username</label>
        <input type="text" id="username" class="filter-input" style="width:100%;" placeholder="admin" required autofocus>
      </div>

      <div>
        <label class="filter-label" style="margin-bottom:0.4rem; display:block;">Password</label>
        <input type="password" id="password" class="filter-input" style="width:100%;" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-primary" style="width:100%; margin-top:0.75rem; padding:0.75rem;">
        Sign In
      </button>
    </form>
  </div>

  <script src="/js/app.js"></script>
  <script>
    checkAuth(true);
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      handleLogin(
        document.getElementById('username').value,
        document.getElementById('password').value
      );
    });
  </script>
</body>
</html>
