<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — KestrelScope</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    body {
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 30%, rgba(15, 108, 189, 0.1), transparent 70%), var(--fui-colorNeutralBackground1);
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <div style="display:inline-flex; align-items:center; justify-content:center; width:48px; height:48px; border-radius:var(--fui-borderRadiusLarge); background:rgba(15, 108, 189, 0.18); border:1px solid var(--fui-colorBrandStroke1); margin-bottom:0.75rem; box-shadow:var(--fui-shadow4);">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="var(--fui-colorBrandForeground1)">
          <path d="M12 2a10 10 0 1 0 10 10A10.011 10.011 0 0 0 12 2zm1 17.93V18a2 2 0 0 0-2-2h-1v-2h2a1 1 0 0 0 1-1V9a1 1 0 0 0-1-1H9.83a3.001 3.001 0 0 0-2.83-2V4.07A8.006 8.006 0 0 1 19.93 11H18a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h1.93A8.01 8.01 0 0 1 13 19.93z"/>
        </svg>
      </div>
      <h1>KestrelScope</h1>
      <p>Sovereign Observability Platform</p>
    </div>

    <div id="loginError" class="login-error"></div>

    <form id="loginForm" class="modal-form">
      <div>
        <label class="filter-label" style="margin-bottom:0.35rem; display:block;">Username</label>
        <input type="text" id="username" class="filter-input" style="width:100%;" placeholder="admin" required autofocus>
      </div>

      <div>
        <label class="filter-label" style="margin-bottom:0.35rem; display:block;">Password</label>
        <input type="password" id="password" class="filter-input" style="width:100%;" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-primary" style="width:100%; margin-top:0.75rem; padding:0.65rem;">
        Sign In
      </button>
    </form>
  </div>

  <script src="/js/app.js"></script>
  <script>
    checkAuth(true);
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      handleLogin(
        document.getElementById('username').value,
        document.getElementById('password').value
      );
    });
  </script>
</body>
</html>
