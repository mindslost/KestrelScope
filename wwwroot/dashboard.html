<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metrics Explorer — KestrelScope</title>
  <link rel="stylesheet" href="/css/main.css">
  <script src="/js/chart.min.js"></script>
</head>
<body>
  <header class="navbar">
    <a href="/dashboard.html" class="nav-brand">
      <svg viewBox="0 0 512 512">
        <path d="M160 32c0-17.7 14.3-32 32-32l32 0c17.7 0 32 14.3 32 32c17.7 0 32 14.3 32 32l0 224c0 17.7-14.3 32-32 32c0 17.7-14.3 32-32 32l-32 0c-17.7 0-32-14.3-32-32c-17.7 0-32-14.3-32-32l0-224c0-17.7 14.3-32 32-32zM32 448l288 0c70.7 0 128-57.3 128-128s-57.3-128-128-128l0-64c106 0 192 86 192 192c0 49.2-18.5 94-48.9 128l16.9 0c17.7 0 32 14.3 32 32s-14.3 32-32 32l-160 0L32 512c-17.7 0-32-14.3-32-32s14.3-32 32-32zm80-64l192 0c8.8 0 16 7.2 16 16s-7.2 16-16 16l-192 0c-8.8 0-16-7.2-16-16s7.2-16 16-16z"/>
      </svg>
      <span>KestrelScope</span>
    </a>

    <nav class="nav-links">
      <a href="/flowmap.html" class="nav-link">
        <svg viewBox="0 0 24 24"><path d="M16 2a3 3 0 0 0-2.83 2H10.83A3.001 3.001 0 0 0 8 2a3 3 0 0 0-3 3c0 1.3.84 2.4 2 2.82V12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2H9V9.82c.48-.18.9-.48 1.23-.85l2.6 1.3c-.02.18-.03.36-.03.55a3 3 0 1 0 6 0 3 3 0 0 0-2.8-3v-1.64c1.16-.41 2-1.52 2-2.82a3 3 0 0 0-3-3z"/></svg>
        <span>Flow Map</span>
      </a>
      <a href="/dashboard.html" class="nav-link active">
        <svg viewBox="0 0 24 24"><path d="M3 3a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h18a1 1 0 1 0 0-2H4V4a1 1 0 0 0-1-1zm5 14a1 1 0 0 0 1-1v-4a1 1 0 1 0-2 0v4a1 1 0 0 0 1 1zm5 0a1 1 0 0 0 1-1V8a1 1 0 1 0-2 0v8a1 1 0 0 0 1 1zm5 0a1 1 0 0 0 1-1v-7a1 1 0 1 0-2 0v7a1 1 0 0 0 1 1z"/></svg>
        <span>Metrics</span>
      </a>
      <a href="/traces.html" class="nav-link">
        <svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 0 1 6.32 12.906l4.387 4.387a1 1 0 0 1-1.414 1.414l-4.387-4.387A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12zm-1 3a1 1 0 0 1 2 0v3.586l2.707 2.707a1 1 0 0 1-1.414 1.414l-3-3A1 1 0 0 1 9 11V7z"/></svg>
        <span>Traces</span>
      </a>
      <a href="/logs.html" class="nav-link">
        <svg viewBox="0 0 24 24"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H14l6 6v11.5a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 19.5v-15zM13.5 3.5V8H18l-4.5-4.5zM7 11a1 1 0 0 0 0 2h10a1 1 0 1 0 0-2H7zm0 4a1 1 0 1 0 0 2h10a1 1 0 1 0 0-2H7z"/></svg>
        <span>Logs</span>
      </a>
      <a href="/alerts.html" class="nav-link">
        <svg viewBox="0 0 24 24"><path d="M12 2c.7 0 1.34.37 1.69.97l8.03 13.91A1.96 1.96 0 0 1 20.02 20H3.98a1.96 1.96 0 0 1-1.7-2.92l8.03-13.91A1.95 1.95 0 0 1 12 2zm0 13a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm0-7a1 1 0 0 0-1 1v4a1 1 0 1 0 2 0V9a1 1 0 0 0-1-1z"/></svg>
        <span>Alert Rules</span>
      </a>
      <a href="/users.html" class="nav-link nav-users-link" style="display:none;">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        <span>Users</span>
      </a>
      <a href="/database.html" class="nav-link nav-database-link" style="display:none;">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 4.02 2 6.5v11C2 19.98 6.48 22 12 22s10-2.02 10-4.5v-11C22 4.02 17.52 2 12 2zm0 2c4.42 0 8 1.57 8 2.5S16.42 9 12 9 4 7.43 4 6.5 7.58 4 12 4zm8 5.5c0 .93-3.58 2.5-8 2.5s-8-1.57-8-2.5V8.2c1.78 1.1 4.71 1.8 8 1.8s6.22-.7 8-1.8v1.3zm0 5.5c0 .93-3.58 2.5-8 2.5s-8-1.57-8-2.5v-1.3c1.78 1.1 4.71 1.8 8 1.8s6.22-.7 8-1.8V15zm0 5.5c0 .93-3.58 2.5-8 2.5s-8-1.57-8-2.5v-1.3c1.78 1.1 4.71 1.8 8 1.8s6.22-.7 8-1.8v1.3z"/></svg>
        <span>Database</span>
      </a>
    </nav>

    <div class="nav-user">
      <div id="userAvatar" class="user-avatar">AD</div>
      <button class="btn-logout" onclick="handleLogout()">
        <svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:currentColor;"><path d="M5 3a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h7a1 1 0 1 0 0-2H5V5h7a1 1 0 1 0 0-2H5zm12.293 4.293a1 1 0 0 1 1.414 0l4 4a1 1 0 0 1 0 1.414l-4 4a1 1 0 0 1-1.414-1.414L18.586 13H10a1 1 0 1 1 0-2h8.586l-1.293-1.293a1 1 0 0 1 0-1.414z"/></svg>
        <span>Sign Out</span>
      </button>
    </div>
  </header>

  <main class="main-container">
    <!-- KPI Stat Cards -->
    <div class="kpi-grid">
      <div class="kpi-card kpi-cyan">
        <div class="kpi-title">
          <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:currentColor;"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6zm0 8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2z"/></svg>
          Monitored Services
        </div>
        <div id="statServices" class="kpi-value">0</div>
      </div>

      <div class="kpi-card kpi-blue">
        <div class="kpi-title">
          <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:currentColor;"><path d="M3 3a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h18a1 1 0 1 0 0-2H4V4a1 1 0 0 0-1-1zm5 14a1 1 0 0 0 1-1v-4a1 1 0 1 0-2 0v4a1 1 0 0 0 1 1zm5 0a1 1 0 0 0 1-1V8a1 1 0 1 0-2 0v8a1 1 0 0 0 1 1zm5 0a1 1 0 0 0 1-1v-7a1 1 0 1 0-2 0v7a1 1 0 0 0 1 1z"/></svg>
          Ingested Samples
        </div>
        <div id="statSamples" class="kpi-value">0</div>
      </div>

      <div class="kpi-card kpi-purple">
        <div class="kpi-title">
          <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:currentColor;"><path d="M12 2c.7 0 1.34.37 1.69.97l8.03 13.91A1.96 1.96 0 0 1 20.02 20H3.98a1.96 1.96 0 0 1-1.7-2.92l8.03-13.91A1.95 1.95 0 0 1 12 2zm0 13a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm0-7a1 1 0 0 0-1 1v4a1 1 0 1 0 2 0V9a1 1 0 0 0-1-1z"/></svg>
          Active Alerts
        </div>
        <div id="statAlerts" class="kpi-value">0</div>
      </div>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar">
      <div class="filter-group">
        <label class="filter-label">Service</label>
        <select id="serviceSelect" class="filter-select">
          <option value="">Loading services...</option>
        </select>
      </div>

      <div class="filter-group">
        <label class="filter-label">Metric</label>
        <select id="metricSelect" class="filter-select">
          <option value="">Loading metrics...</option>
        </select>
      </div>

      <div class="filter-group">
        <label class="filter-label">Time Window</label>
        <select id="windowSelect" class="filter-select">
          <option value="15">Last 15 Minutes</option>
          <option value="60" selected>Last 1 Hour</option>
          <option value="360">Last 6 Hours</option>
          <option value="1440">Last 24 Hours</option>
        </select>
      </div>
    </div>

    <!-- Chart Panel -->
    <div class="chart-card">
      <div class="chart-header">
        <h2 id="chartTitle" class="chart-title">Metric Performance</h2>
      </div>
      <div class="chart-wrapper">
        <canvas id="metricsCanvas"></canvas>
      </div>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', initDashboard);
  </script>
</body>
</html>
